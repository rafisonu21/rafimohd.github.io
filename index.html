<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parallel You</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>Parallel You</h1>
</header>

<main>
<section id="hero">
<h2>Ever wondered who you could’ve been?</h2>
<button id="discover-button">Discover Your Parallel Self</button>
</section>

<section id="user-input" class="hidden">
<form id="user-form">
<label for="current-job">Current Job / Degree:</label>
<input type="text" id="current-job" name="current-job" required>

<label for="current-city">Current City:</label>
<input type="text" id="current-city" name="current-city" required>

<label for="hobby">A Hobby or Passion:</label>
<input type="text" id="hobby" name="hobby" required>

<label for="regret">One Choice You Regret / Wish You Made Differently:</label>
<input type="text" id="regret" name="regret" required>

<button type="submit">Generate My Parallel Self</button>
</form>
</section>

<section id="parallel-profile" class="hidden">
<!-- Profile content will be dynamically generated here -->
</section>

<section id="share-card" class="hidden">
<!-- Shareable card will be dynamically generated here -->
</section>

<section id="return-triggers" class="hidden">
<!-- Addictive return triggers will be dynamically generated here -->
</section>
</main>

<script src="script.js"></script>
</body>
</html>
